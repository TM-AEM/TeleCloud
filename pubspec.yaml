name: cloud_storage_file_manager
description: "Cloud storage file manager with automatic scheduled photo & video backup and proper Android permissions handling."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # 1. إدارة الأذونات والتحقق من حالتها وطلبها وفتح إعدادات التطبيق
  permission_handler: ^11.3.1

  # 2. معرفة معلومات الجهاز وإصدار أندرويد (SDK_INT)
  device_info_plus: ^10.1.0

  # 3. اختيار الملفات والوسائط يدويًا
  file_picker: ^8.0.5
  image_picker: ^1.1.2

  # 4. الوصول لمجلدات التطبيق الداخلية والخاصة
  path_provider: ^2.1.3

  # 5. حفظ الملفات في مجلد التنزيلات العام عبر MediaStore API
  media_store_plus: ^0.4.1

  # 6. إدارة الحالة (State Management)
  provider: ^6.1.2

  # 7. أيقونات وتصميم
  cupertino_icons: ^1.0.6

  # 8. جدولة المهام في الخلفية للنسخ الاحتياطي التلقائي
  workmanager: ^0.5.2

  # 9. الوصول لألبومات ومجلدات وسائط الجهاز (Camera, WhatsApp, Screenshots...)
  photo_manager: ^3.1.4

  # 10. إرسال إشعارات محلية عند انتهاء عملية النسخ الاحتياطي
  flutter_local_notifications: ^17.2.2

  # 11. تخزين إعدادات النسخ وقائمة الملفات المرفوعة وسجل المزامنة محليًا
  shared_preferences: ^2.3.2

  # 12. الاتصال بـ API الرفع POST /files/upload و Multipart requests
  http: ^1.2.2

  # 13. حساب Hashes لتفادي رفع نفس الملفات مكررة
  crypto: ^3.0.5

  # 14. تنسيق التواريخ والوقت
  intl: ^0.19.0
  path: ^1.9.0

  # 15. مشاركة النصوص والروابط
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
