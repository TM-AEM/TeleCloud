version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tg_cloud_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: telegram_cloud_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  telegram-bot-api:
    image: telegram/bot-api:latest
    container_name: tg_bot_api
    restart: always
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "true"
      TELEGRAM_STAT: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
      - "8082:8082"

volumes:
  pgdata:
  telegram-bot-api-data:
